[package]
name = "pcyp-rust"
version = "0.4.1"
edition = "2024"
license = "MIT"
description = "Windows 用の PeerCast YP ブラウザ"
repository = "https://github.com/amiami5/pcyp-rust"
build = "src/build.rs"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = "0.35.0"
encoding_rs = "0.8.41"
raw-window-handle = "0.6"
regex = "1.13.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
skrifa = "0.42.1"
tauri-winrt-notification = "0.8.1"
tray-icon = "0.25.1"
ureq = "3.4.2"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp","Win32_Security", "Win32_Security_Cryptography", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
flate2 = "1"

[build-dependencies]
embed-resource = "3"

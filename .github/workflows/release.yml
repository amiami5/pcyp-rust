# リリース用の zip を GitHub のサーバーでビルドして、リリースに添付する。
#
# - v で始まるタグを push すると動く
# - Actions の画面 (または gh workflow run) から、タグ名を指定して手で動かすこともできる
#
# そのタグのリリースがあれば zip を置き換え、なければ下書きのリリースを作る。
# 公開は、中身を確かめてから手で行う。
#
# 下書きを公開するとタグが付いて、もう一度このワークフローが動く。そのときは、リリースに
# もう zip があればビルドしないで終わる (公開した zip を置き換えない)。手で動かしたときは毎回作り直す。
#
# 書き込みのできるトークンは、ビルドするジョブに持たせない。同じジョブの中だと、step の env から外しても、
# cargo test / build で動く依存クレートの build.rs などが、ランナーのメモリや $GITHUB_ENV・$GITHUB_PATH
# (後の step の gh を差し替えられる) を通して取れるため。ビルドは読むだけのトークンで行い、zip は
# 成果物にして、gh しか動かさないジョブで添付する。

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "添付するリリースのタグ (例 v0.1.0)"
        required: true

# 権限は、ジョブごとに要るものだけを付ける
permissions: {}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  ZIP: pcyp-rust-${{ github.event.inputs.tag || github.ref_name }}-windows-x64.zip
  GH_REPO: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    # 下書きのリリースも見るので、書き込みの権限が要る (gh しか動かさない)
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: もう zip があるか確かめる (タグの push のときだけ)
        id: check
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $names = gh release view $env:TAG --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -eq 0 -and ($names -contains $env:ZIP)) {
            "リリース $env:TAG にはもう $env:ZIP があるので、ビルドしません"
            "skip=true" >> $env:GITHUB_OUTPUT
          }
          exit 0

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # トークンを git の設定に残さない
          persist-credentials: false

      - name: Rust の準備
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: テスト
        run: cargo test --locked

      - name: ビルド
        run: cargo build --release --locked

      - name: zip にまとめる
        shell: pwsh
        run: |
          $name = [IO.Path]::GetFileNameWithoutExtension($env:ZIP)
          New-Item -ItemType Directory -Force $name | Out-Null
          Copy-Item target/release/pcyp-rust.exe, LICENSE, README.md $name
          Compress-Archive -Path $name -DestinationPath $env:ZIP -Force

      - name: zip を次のジョブに渡す
        uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: ${{ env.ZIP }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: zip を受け取る
        uses: actions/download-artifact@v8
        with:
          name: release-zip

      - name: リリースに添付する
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:ZIP --clobber
          } else {
            gh release create $env:TAG $env:ZIP --draft --title $env:TAG --generate-notes
          }
